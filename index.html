<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avant de te revoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #f7d9cf;
    --sky-mid: #f3c1c6;
    --sky-low: #c9c3e6;
    --ink: #2e2a52;
    --ink-soft: #5d5886;
    --glow: #e8607a;
    --gold: #c98a2b;
    --star: rgba(255,255,255,0);
    --panel: rgba(255,255,255,0.45);
    --line: rgba(46,42,82,0.25);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #14163a;
      --sky-mid: #2a2459;
      --sky-low: #5b3a6e;
      --ink: #fbeee6;
      --ink-soft: #b8b1dc;
      --glow: #ff8fa6;
      --gold: #f6d58e;
      --star: rgba(255,255,255,0.9);
      --panel: rgba(20,22,58,0.5);
      --line: rgba(251,238,230,0.25);
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #14163a;
    --sky-mid: #2a2459;
    --sky-low: #5b3a6e;
    --ink: #fbeee6;
    --ink-soft: #b8b1dc;
    --glow: #ff8fa6;
    --gold: #f6d58e;
    --star: rgba(255,255,255,0.9);
    --panel: rgba(20,22,58,0.5);
    --line: rgba(251,238,230,0.25);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); min-height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sky-mid);
    color: var(--ink);
    font-family: "Karla", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--star);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: 0.2; } }

  main {
    position: relative; z-index: 1;
    width: min(100%, 980px);
    padding: clamp(2.5rem, 8vh, 6rem) 1.25rem 4rem;
    text-align: center;
    flex: 1;
  }
  .lead {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: clamp(1.4rem, 3.4vw, 2.1rem);
    color: var(--ink-soft);
    margin: 0 0 0.3rem;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 5.2rem);
    line-height: 1;
    margin: 0 0 clamp(2rem, 6vh, 3.5rem);
    letter-spacing: -0.01em;
  }

  /* The countdown */
  .clock {
    display: flex; justify-content: center; align-items: flex-end;
    flex-wrap: wrap; gap: clamp(0.6rem, 3vw, 2.4rem);
  }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 3.2ch; }
  .num {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-variant-numeric: tabular-nums lining-nums;
    line-height: 0.9;
    font-size: clamp(3.2rem, 11vw, 7.5rem);
  }
  .unit.big .num { font-size: clamp(4.4rem, 16vw, 11rem); }
  .unit.small .num { font-size: clamp(2.2rem, 6vw, 4rem); color: var(--ink-soft); }
  .lbl { font-size: 0.95rem; color: var(--ink-soft); margin-top: 0.4rem; display: flex; flex-direction: column; align-items: center; }
  .lbl .aside { font-size: 0.75rem; font-style: italic; opacity: 0.8; white-space: nowrap; }
  .sep {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem); color: var(--ink-soft);
    padding-bottom: 2.2rem;
  }

  /* The distance between us */
  .distance { margin: clamp(3rem, 9vh, 5rem) auto 0; max-width: 720px; }
  .track { position: relative; height: 90px; }
  .track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px dashed var(--line);
  }
  .fill {
    position: absolute; top: 50%; height: 2px; margin-top: -1px;
    background: var(--glow); opacity: 0.7;
  }
  .fill.l { left: 0; } .fill.r { right: 0; }
  .who {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    transition: left 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--glow) 25%, transparent), 0 0 24px var(--glow);
  }
  .who .name {
    position: absolute; top: 28px; white-space: nowrap;
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 1.25rem;
  }
  .meet-heart {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px; color: var(--gold); opacity: 0.55;
  }
  .progress-text { color: var(--ink-soft); margin: 1.6rem 0 0; font-size: 1rem; }
  .progress-text strong { color: var(--ink); font-weight: 500; }

  .note {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: clamp(1.2rem, 2.8vw, 1.5rem);
    max-width: 34ch; margin: clamp(2.5rem, 7vh, 4rem) auto 0; line-height: 1.45;
  }

  /* Speech bubbles when you tap a dot */
  .who { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
  .bubble {
    position: absolute; bottom: 30px; width: max-content; max-width: min(260px, 62vw); text-align: left;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 14px 14px 14px 4px;
    padding: 0.4rem 0.75rem; font-size: 0.9rem;
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  #me .bubble { left: -4px; }
  #you .bubble { right: -4px; border-radius: 14px 14px 4px 14px; text-align: right; }
  .bubble.show { opacity: 1; transform: none; }
  .hint { font-size: 0.85rem; color: var(--ink-soft); margin: 0.6rem 0 0; opacity: 0.8; }

  /* Rotating jokes */
  .quip {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.6rem);
    max-width: 36ch; margin: clamp(2.5rem, 7vh, 4rem) auto 0; line-height: 1.4;
    min-height: 4.6em; transition: opacity .4s;
  }
  .quip.fade { opacity: 0; }
  .quip-btn {
    font: inherit; font-size: 0.9rem; color: var(--ink-soft); background: none;
    border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0.3rem;
  }

  /* Meanwhile, the boring statistics */
  .stats { margin: clamp(2.5rem, 7vh, 4rem) auto 0; max-width: 640px; text-align: left; }
  .stats h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(1.5rem, 3.6vw, 2rem); margin: 0 0 0.8rem; text-align: center;
  }
  .stats ul { list-style: none; margin: 0; padding: 0; }
  .stats li {
    display: grid; grid-template-columns: 8.5rem 1fr; gap: 1rem; align-items: baseline;
    padding: 0.7rem 0; border-top: 1px dashed var(--line); line-height: 1.45;
  }
  .stats li:last-child { border-bottom: 1px dashed var(--line); }
  .stats b {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.6rem;
    text-align: right; font-variant-numeric: tabular-nums; color: var(--glow);
  }

  /* Arrival */
  .arrived h1 { margin-bottom: 1rem; }
  .arrived .clock { display: none; }

  @media (max-width: 760px) {
    .stats li { grid-template-columns: 6.5rem 1fr; }
  }
  @media (max-width: 560px) {
    main { padding-left: 1rem; padding-right: 1rem; }
    .sep { display: none; }
    /* months + days on top, hours / minutes / seconds underneath */
    .clock {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1.4rem 0.5rem; align-items: end; max-width: 380px; margin: 0 auto;
    }
    .unit.big { grid-column: 2 / 4; }
    .unit .num { font-size: clamp(3rem, 15vw, 4rem); }
    .unit.big .num { font-size: clamp(4.6rem, 26vw, 6.5rem); }
    .unit.small .num { font-size: clamp(2.2rem, 11vw, 2.8rem); }
    .track { height: 110px; }
    .who .name { font-size: 1.1rem; }
    .progress-text { font-size: 0.95rem; line-height: 1.6; }
    .stats li { grid-template-columns: 1fr; gap: 0.1rem; }
    .stats b { text-align: left; }
  }
  @media (max-width: 340px) {
    .lbl .aside { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; }
    .who { transition: none; }
  }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<main id="main">
  <p class="lead" id="lead">Avant de te serrer dans mes bras</p>
  <h1 id="title">juillet 2027</h1>

  <div class="clock" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="months">0</span><span class="lbl" id="l-months">mois</span></div>
    <span class="sep" aria-hidden="true">&amp;</span>
    <div class="unit big"><span class="num" id="days">0</span><span class="lbl" id="l-days">jours</span></div>
    <div class="unit small"><span class="num" id="hours">00</span><span class="lbl">heures</span></div>
    <div class="unit small"><span class="num" id="minutes">00</span><span class="lbl">minutes</span></div>
    <div class="unit small"><span class="num" id="seconds">00</span><span class="lbl">secondes<span class="aside">oui, je compte</span></span></div>
  </div>

  <section class="distance" aria-label="Notre distance">
    <div class="track">
      <div class="fill l" id="fillL"></div>
      <div class="fill r" id="fillR"></div>
      <svg class="meet-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.6.2.3.6.3.8 0 .8-1.4 2.3-2.6 4.4-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <button class="who" id="me" aria-label="Toucher Enzoka"><span class="bubble" id="bubbleA"></span><span class="dot"></span><span class="name" id="nameA">Enzoka</span></button>
      <button class="who" id="you" aria-label="Toucher Musako"><span class="bubble" id="bubbleB"></span><span class="dot"></span><span class="name" id="nameB">Musako</span></button>
    </div>
    <p class="progress-text" id="progress"></p>
    <p class="hint">Touche les points. Ils ont des choses à dire.</p>
  </section>

  <p class="quip" id="quip" aria-live="polite"></p>
  <button class="quip-btn" id="nextQuip">Une autre</button>

  <section class="stats" aria-label="Statistiques de l'attente">
    <h2>D'ici là, je vais probablement…</h2>
    <ul id="stats"></ul>
  </section>

  <p class="note" id="note">Chaque seconde sur cette page, c'est une seconde de moins entre nous.</p>
</main>


<script>
(function () {
  // ===== Fixed settings =====
  var DEFAULTS = {
    target: "2027-07-01T00:00",
    start: "2026-08-12T00:00",
    nameA: "Enzoka",
    nameB: "Musako",
    note: "Chaque seconde sur cette page, c'est une seconde de moins entre nous."
  };

  var state = {
    target: DEFAULTS.target,
    nameA: DEFAULTS.nameA,
    nameB: DEFAULTS.nameB,
    note: DEFAULTS.note,
    start: DEFAULTS.start
  };

  var $ = function (id) { return document.getElementById(id); };
  var monthNames = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function targetDate() { return new Date(state.target); }

  function addMonths(d, n) {
    var r = new Date(d.getTime());
    var day = r.getDate();
    r.setDate(1);
    r.setMonth(r.getMonth() + n);
    var last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    r.setDate(Math.min(day, last));
    return r;
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function render() {
    var t = targetDate();
    $("title").textContent = t.getDate() + " " + monthNames[t.getMonth()] + " " + t.getFullYear();
    $("nameA").textContent = state.nameA;
    $("nameB").textContent = state.nameB;
    $("note").textContent = state.note;
    tick();
  }

  function tick() {
    var now = new Date();
    var t = targetDate();
    var main = $("main");

    if (now >= t) {
      main.classList.add("arrived");
      $("lead").textContent = "L'attente est finie";
      $("title").textContent = "Aujourd'hui, " + state.nameA + " & " + state.nameB;
      setProgress(1);
      $("progress").innerHTML = "<strong>Ensemble.</strong> Pourquoi vous regardez encore ce site ? Allez vous faire un câlin !";
      return;
    }
    main.classList.remove("arrived");
    $("lead").textContent = "Avant de te serrer dans mes bras";

    var months = 0;
    while (addMonths(now, months + 1) <= t) months++;
    var rest = t - addMonths(now, months);
    var days = Math.floor(rest / 86400000); rest -= days * 86400000;
    var hours = Math.floor(rest / 3600000); rest -= hours * 3600000;
    var minutes = Math.floor(rest / 60000); rest -= minutes * 60000;
    var seconds = Math.floor(rest / 1000);

    $("months").textContent = months;
    $("days").textContent = days;
    $("hours").textContent = pad(hours);
    $("minutes").textContent = pad(minutes);
    $("seconds").textContent = pad(seconds);
    $("l-months").textContent = "mois";
    $("l-days").textContent = days <= 1 ? "jour" : "jours";

    var start = new Date(state.start);
    var total = t - start;
    var p = total > 0 ? Math.min(1, Math.max(0, (now - start) / total)) : 0;
    setProgress(p);

    var totalDays = Math.ceil((t - now) / 86400000);
    var apart = Math.floor((now - start) / 86400000);
    $("progress").innerHTML = "<strong>" + apart + "</strong> jours survécus depuis ton départ le " + start.getDate() + " " + monthNames[start.getMonth()] + ". Plus que <strong>" +
      totalDays + "</strong> dodos.<br>" + progressJoke(p) +
      "<br>Transformation muscu en cours : <strong>" + Math.round(p * 100) + " %</strong> " + glowJoke(p);
    if (now.getSeconds() === 0 || !statsDone) { renderStats(t - now, totalDays); statsDone = true; }
  }
  var statsDone = false;

  function progressJoke(p) {
    var pct = "<strong>" + (p * 100).toFixed(1).replace(".", ",") + " %</strong>";
    if (p < 0.005) return "Progression : quasi nulle. Mais émotionnellement ? Énorme.";
    if (p < 0.10) return pct + " fait. On a quitté le parking.";
    if (p < 0.25) return pct + " fait. On est bientôt arrivés ? Non.";
    if (p < 0.50) return pct + " fait. Toujours pas. Arrête de demander.";
    if (p < 0.55) return pct + " fait. La moitié ! Quelqu'un apporte un gâteau.";
    if (p < 0.75) return pct + " fait. Ça descend à partir d'ici (dans le bon sens).";
    if (p < 0.90) return pct + " fait. Commence à t'entraîner pour le câlin à l'aéroport.";
    if (p < 0.98) return pct + " fait. Fais ta valise. Défais-la. Refais-la.";
    return pct + " fait. Brosse-toi les dents. Sérieusement. Maintenant.";
  }

  function glowJoke(p) {
    if (p < 0.2) return "(actuellement : fort dans ma tête)";
    if (p < 0.4) return "(bras : visibles si on plisse les yeux)";
    if (p < 0.6) return "(t-shirts un peu plus serrés)";
    if (p < 0.8) return "(des inconnus me demandent des conseils muscu)";
    if (p < 0.98) return "(décollage du câlin à l'aéroport confirmé)";
    return "(prêt. tellement prêt.)";
  }

  // ===== Jokes =====
  var QUIPS = [
    "Relation à distance : quand ton téléphone devient ton objet préféré en forme d'humain.",
    "Statut actuel : je câline mon oreiller et je fais comme s'il riait à mes blagues.",
    "Les scientifiques confirment : les appels vidéo ne transmettent pas les câlins. Pas encore. J'ai porté plainte.",
    "J'ai demandé au calendrier d'aller plus vite. Il a dit non. Malpoli.",
    "Notre couple, c'est 90 % de « tu m'entends ? » et 10 % de « t'as freezé, répète ».",
    "La distance, ce n'est rien quand on s'aime. Enfin si, c'est des billets d'avion. Beaucoup de billets d'avion.",
    "J'ai encore regardé cette page. Pas grand-chose n'a changé. Je regarde à nouveau dans 4 minutes.",
    "Attention : le jour J, je risque de te serrer dans mes bras assez longtemps pour inquiéter la sécurité de l'aéroport.",
    "Mon fuseau horaire et le tien ne sont pas amis. Mais nous, si.",
    "Programme du premier jour : câlin. Manger. Câlin. Sieste. Câlin. Remanger.",
    "Info : rafraîchir cette page ne fait pas venir juillet plus vite. J'ai testé. Plusieurs fois.",
    "Tu me manques. C'est mon cardio.",
    "Je traverserais l'océan à la nage pour toi. Mais franchement l'avion est plus rapide et il y a des snacks.",
    "Officiellement dans ma phase « je parle à la lune parce qu'on est sous la même ».",
    "Nouvelles de la salle : je ne soulève pas des poids, je soulève le poids de ton absence. Et des poids aussi.",
    "Chaque répétition me rapproche de toi. Le temps ne marche pas comme ça, mais c'est l'impression que ça donne.",
    "Objectif pour juillet : te porter TOI et ta valise jusqu'à la sortie de l'aéroport. En un seul voyage.",
    "J'ai sauté le leg day une fois. Puis je me suis rappelé que je dois courir vers toi aux arrivées.",
    "Mon coach m'a demandé ce qui me motive. Je lui ai montré ce site.",
    "T'inquiète, je ne vais pas devenir trop baraqué. Tu tiendras toujours dans mes bras. C'est tout le plan.",
    "Shaker de protéines dans une main, téléphone dans l'autre, j'attends ton message du matin."
  ];
  var quipIndex = Math.floor(Math.random() * QUIPS.length);
  function showQuip(next) {
    var el = $("quip");
    if (next) quipIndex = (quipIndex + 1) % QUIPS.length;
    el.classList.add("fade");
    setTimeout(function () { el.textContent = QUIPS[quipIndex]; el.classList.remove("fade"); }, next ? 300 : 0);
  }
  $("nextQuip").addEventListener("click", function () { showQuip(true); resetQuipTimer(); });
  var quipTimer;
  function resetQuipTimer() { clearInterval(quipTimer); quipTimer = setInterval(function () { showQuip(true); }, 12000); }

  // ===== Silly statistics =====
  function fmt(n) { return Math.round(n).toLocaleString("fr-FR"); }
  function renderStats(ms, days) {
    var weeks = days / 7;
    var items = [
      [days * 1, "messages « bonne nuit », chacun plus dramatique que le précédent"],
      [days * 6, "fois où je regarde ce compte à rebours (estimation prudente)"],
      [ms / 1000 * 1.2, "battements de cœur, dont un nombre suspect qui s'emballent quand tu m'écris"],
      [weeks * 2, "pizzas mangées seul, c'est tragique, mais ça fait plus de pizza pour moi"],
      [days * 0.9, "nuits à dormir en diagonale dans le lit, par solitude, évidemment"],
      [weeks * 3, "« tu coupes » pendant les appels vidéo (la faute à internet, pas à nous)"],
      [days / 3, "fois où je regarde presque notre série sans toi. Presque."],
      [weeks * 4, "séances de sport, pour que le câlin à l'aéroport te soulève du sol"],
      [days * 30, "pompes, à quelques centaines de « je les ferai demain » près"],
      [weeks * 5, "shakers de protéines au goût de vanille triste"],
      [weeks * 3, "fois où je me regarde dans le miroir de la salle en pensant « elle va adorer »"],
      [weeks, "leg days que je ne sauterai absolument pas (j'en ai besoin pour courir vers toi aux arrivées)"]
    ];
    $("stats").innerHTML = items.map(function (it) {
      return "<li><b>" + fmt(it[0]) + "</b><span>" + it[1] + "</span></li>";
    }).join("");
  }

  // ===== The dots talk =====
  var LINES_A = ["On est bientôt arrivés ?", "Je marche aussi vite que je peux", "Garde-moi la place côté hublot", "C'est toi ? Ah non, un lampadaire", "Je m'entraîne à la pose câlin", "Me touche pas, touche le calendrier", "Je fais des fentes vers toi", "Encore une série et je t'appelle", "Abdos en chargement… patiente"];
  var LINES_B = ["Dépêche-toi, escargot", "J'ai apporté des snacks", "Mes bras se fatiguent d'attendre", "Arrête de cliquer, marche", "Je te vois d'ici (non)", "Ramène du chocolat ou ne viens pas", "C'est des nouveaux muscles ?!", "Reviens pas plus fort que moi"];
  function talk(btn, bubble, lines) {
    var timer;
    btn.addEventListener("click", function () {
      bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
      bubble.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(function () { bubble.classList.remove("show"); }, 2200);
    });
  }
  talk($("me"), $("bubbleA"), LINES_A);
  talk($("you"), $("bubbleB"), LINES_B);
  showQuip(false);
  resetQuipTimer();

  function setProgress(p) {
    // The two dots begin at opposite ends and walk toward the heart in the middle
    var half = p * 50;
    $("me").style.left = half + "%";
    $("you").style.left = (100 - half) + "%";
    $("fillL").style.width = half + "%";
    $("fillR").style.width = half + "%";
  }

  // Stars (only visible in night mode)
  var sky = $("stars");
  for (var i = 0; i < 70; i++) {
    var s = document.createElement("span");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 70 + "%";
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
    if (Math.random() > 0.85) { s.style.width = s.style.height = "3px"; }
    sky.appendChild(s);
  }


  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
